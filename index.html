<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f8f4" />
    <meta
      name="description"
      content="Curso interativo sobre aplicações de IA, inferência e operação de modelos em escala."
    />
    <title>Inference Atlas — IA em escala</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('atlas:theme') === 'dark') document.documentElement.dataset.theme = 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p lang="pt-BR">Ative o JavaScript para abrir o curso e seus diagramas interativos.</p>
      <p lang="en">Enable JavaScript to open the course and its interactive diagrams.</p>
    </noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
